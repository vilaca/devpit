name: Release

# Cut a release from a version tag. See docs/Releasing.md for the operator
# procedure and ADR-0023 for the decisions behind this pipeline.
on:
  push:
    tags: ['v*']

# Read-only by default; only the release job gets write scopes.
permissions:
  contents: read

jobs:
  # Gate before release: a tag on a red commit must not ship (ADR-0023,
  # ADR-0013). This runs the exact gate developers run locally — scripts/check.sh
  # --ci, all gates — so a released artifact is never less-checked than a PR.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # the secrets gate scans all history reachable from HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: scripts/check.sh --ci

  release:
    needs: gate
    runs-on: ubuntu-latest
    # goreleaser creates the GitHub Release (contents) and pushes the GHCR image
    # (packages) with GITHUB_TOKEN; the tap formula is pushed with a separate
    # HOMEBREW_TAP_TOKEN secret.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the changelog can range over commits
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      # QEMU + buildx let the amd64 runner also build the linux/arm64 image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned to the last release before v2.10 deprecated `brews`: we keep a
          # formula for `brew services` (see .goreleaser.yaml PIN NOTE / ADR-0023).
          # Must match the local pin in docs/Releasing.md.
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
