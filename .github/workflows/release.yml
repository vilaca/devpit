name: Release

# Cut a release from a version tag. See docs/Releasing.md for the operator
# procedure and ADR-0023 for the decisions behind this pipeline.
on:
  push:
    tags: ['v*']

# Read-only by default; only the release job gets write scopes.
permissions:
  contents: read

jobs:
  # Gate before release: a tag on a red commit must not ship (ADR-0023,
  # ADR-0013). This runs the exact gate developers run locally — scripts/check.sh
  # --ci, all gates — so a released artifact is never less-checked than a PR.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: scripts/check.sh --ci

  release:
    needs: gate
    runs-on: ubuntu-latest
    # goreleaser creates the GitHub Release (contents) and pushes the GHCR image
    # (packages) with GITHUB_TOKEN; the tap formula is pushed with a separate
    # HOMEBREW_TAP_TOKEN secret.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the changelog can range over commits
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      # QEMU + buildx let the amd64 runner also build the linux/arm64 image.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned to the last release before v2.10 deprecated `brews`: we keep a
          # formula for `brew services` (see .goreleaser.yaml PIN NOTE / ADR-0023).
          # Must match the local pin in docs/Releasing.md.
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
